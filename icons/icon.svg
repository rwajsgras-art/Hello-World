<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DoD AI News">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Pentagon (regular, 5-pointed) -->
  <polygon points="256,96 408,206 350,384 162,384 104,206"
           fill="url(#p)" stroke="#0b1220" stroke-width="8" stroke-linejoin="round"/>
  <!-- Neural nodes/edges overlay suggesting AI -->
  <g stroke="#0b1220" stroke-width="6" fill="#0b1220" opacity="0.92">
    <line x1="200" y1="230" x2="312" y2="230"/>
    <line x1="200" y1="230" x2="256" y2="300"/>
    <line x1="312" y1="230" x2="256" y2="300"/>
    <line x1="200" y1="230" x2="256" y2="170"/>
    <line x1="312" y1="230" x2="256" y2="170"/>
    <circle cx="256" cy="170" r="14"/>
    <circle cx="200" cy="230" r="14"/>
    <circle cx="312" cy="230" r="14"/>
    <circle cx="256" cy="300" r="14"/>
  </g>
</svg>
