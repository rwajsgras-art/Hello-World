<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DoD AI News" />
  <title>DoD AI News</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>DoD <span class="accent">AI</span> News</h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
        </svg>
      </button>
    </div>
    <div class="filters" role="tablist" aria-label="Filter by source category">
      <button class="chip active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="chip" data-filter="pentagon" role="tab">Pentagon</button>
      <button class="chip" data-filter="services" role="tab">Services</button>
      <button class="chip" data-filter="research" role="tab">Research</button>
      <button class="chip" data-filter="industry" role="tab">Industry</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search titles & summaries…" aria-label="Search articles" />
    </div>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>

  <footer class="footer">
    <span id="status">Loading…</span>
    <span id="updated"></span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
